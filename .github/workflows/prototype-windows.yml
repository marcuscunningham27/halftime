# Builds Halftime's Windows installer, so it can be tried on a PC without installing Rust or Node there.
# Download it from the run's Artifacts. It's unsigned: Windows SmartScreen asks once (More info › Run anyway).
name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web-prototype/**', '.github/workflows/prototype-windows.yml']

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-prototype/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: web-prototype/src-tauri
      - run: npm ci
      - run: npm test
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: halftime-windows-installer
          path: web-prototype/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
